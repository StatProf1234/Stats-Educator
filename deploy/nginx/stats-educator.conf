server {
    server_name statseducator.com www.statseducator.com;

    root /var/www/stats-educator;
    index index.html;

    # Maintenance mode. Toggle with `sudo maintenance on|off`, which just
    # creates or removes the flag file below. Serving 503 (rather than a
    # 200 page saying "we're down") is what tells search engines to come
    # back later instead of deindexing the site.
    set $maintenance 0;
    if (-f /var/www/maintenance/.enabled) { set $maintenance 1; }
    if ($is_acme_challenge)               { set $maintenance 0; }
    if ($maintenance)                     { return 503; }

    # Lets the holding page be reviewed on the live server without taking
    # the site down. Answers 200, so the page's auto-reload stays off here.
    location = /maintenance-preview {
        root /var/www/maintenance;
        rewrite ^ /index.html break;
        add_header Cache-Control "no-store" always;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/maintenance;
        rewrite ^ /index.html break;
        add_header Retry-After 1800 always;
        add_header Cache-Control "no-store" always;
    }

    # Single-page app: routing is hash-based, so a plain file lookup with an
    # index.html fallback is all that's needed.
    # The page shell must always be revalidated. Without this nginx sends no
    # Cache-Control at all, which lets a browser keep serving a stale copy
    # (on this domain, the parked page that used to live here) and never ask
    # again. The ETag makes the revalidation a cheap 304.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprint-free assets: revalidate so a deploy is picked up immediately.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(woff2|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip_static on;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/statseducator.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/statseducator.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.statseducator.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = statseducator.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name statseducator.com www.statseducator.com;
    return 404; # managed by Certbot




}